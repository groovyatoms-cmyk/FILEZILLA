<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Applies the stored theme before first paint so there is no flash of the wrong
      // theme on load/refresh. Must stay logically in sync with src/hooks/useTheme.tsx
      // (same storage key, same "dark" default, same "system" resolution).
      (function () {
        try {
          var stored = localStorage.getItem("securetransfer:theme");
          var theme = stored === "light" || stored === "dark" || stored === "system" ? stored : "dark";
          var isDark = theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="FILEZILLA v2 — a privacy-first, end-to-end encrypted peer-to-peer file transfer application."
    />
    <title>FILEZILLA v2</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
